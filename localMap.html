<!DOCTYPE html>
<html>
  <head>
    <title>Simple Marker</title>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAKLjisxFelKwIl1_G6MiEO9-ya7Twr5s&callback=console.debug&libraries=maps,marker&v=beta">
    </script>
    <style>

      #map {
        height: 100%;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 12,
          center: { lat: 35.28, lng: 136.95 },
          zoomControl: true,
          mapTypeControl: true,
          streetViewControl: false
        });

        const infoWindow = new google.maps.InfoWindow();

        const marker = new google.maps.Marker({
          position: { lat: 35.28889, lng: 136.919853 },
          map: map,
          title: "メナード美術館"
        });
        marker.addListener("click", () => {
          infoWindow.setContent(`
            <div style="width: 200px;">
              <h1>メナード美術館</h1>
              <img src="./img/menado.jpg" alt="メナード美術館" style="width: 100%; height: auto; border-radius: 4px;">
              <p>印象派以降の西洋絵画や日本の近代・現代美術などを幅広く所蔵・公開している美術館</p>
            </div>
          `);
          infoWindow.open(map, marker);
        });

        const marker2 = new google.maps.Marker({
          position: { lat: 35.292509, lng: 136.913428 },
          map: map,
          title: "小牧城"
        });
        marker2.addListener("click", () => {
          infoWindow.setContent(`
            <div style="width: 200px;">
              <h1>小牧城</h1>
              <img src="./img/castle.jpg" alt="小牧城" style="width: 100%; height: auto; border-radius: 4px;">
              <p>1563年に織田信長によって築られた歴史と自然あふれる平山城</p>
            </div>
          `);
          infoWindow.open(map, marker2);
        });

        const marker3 = new google.maps.Marker({
          position: { lat: 35.315825, lng: 136.941359 },
          map: map,
          title: "田縣神社"
        });
        marker3.addListener("click", () => {
          infoWindow.setContent(`
            <div style="width: 200px;">
              <h1>田縣神社</h1>
              <img src="./img/shrine.jpg" alt="田縣神社" style="width: 100%; height: auto; border-radius: 4px;">
              <p>五穀豊穣や子孫繁栄の神様を祀る、国内外で広く知られた歴史ある古社</p>
            </div>
          `);
          infoWindow.open(map, marker3);
        });

        const marker4 = new google.maps.Marker({
          position: { lat: 35.311633, lng: 137.005983 },
          map: map,
          title: "四季の森"
        });
        marker4.addListener("click", () => {
          infoWindow.setContent(`
            <div style="width: 200px;">
              <h1>四季の森</h1>
              <img src="./img/forest.jpg" alt="四季の森" style="width: 100%; height: auto; border-radius: 4px;">
              <p>市民四季の森は、愛知県小牧市大草にある広大な総合公園。面積は約28.2ヘクタールで、自然の中で遊んだり、BBQをしたり、スポーツを楽しんだりできる公園だよ</p>
            </div>
          `);
          infoWindow.open(map, marker4);
        });

        map.addListener("click", () => {
          infoWindow.close();
        });
      }

      window.initMap = initMap;
      window.addEventListener("load", () => {
        initMap();
      });
    </script>
  </body>
</html>
